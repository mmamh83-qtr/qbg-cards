:root{--g:#0E5C3E;--g2:#14794F;--gd:#0a3f2b;--cream:#FBFAF5;--gold:#C2A04A;--gold2:#9c7e2f;
--ink:#23302a;--mut:#71807a;--line:#e2e7e1;--paper:#ffffff;
--A:#0E5C3E;--B:#9A6A0F;--C:#2E5A8F;}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
font-family:'Tajawal',"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.ser{font-family:'Tajawal',"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 14px 40px}
.top{background:#fff;border-bottom:3px solid var(--g);padding:18px 14px}
.top .inner{max-width:880px;margin:0 auto;display:flex;justify-content:center;align-items:center}
.top .brand{height:140px;width:auto;max-width:100%;object-fit:contain;display:block}
@media(max-width:600px){.top .brand{height:92px}}
.logo{width:62px;height:62px;border-radius:50%;background:#fff;flex:0 0 auto;display:flex;
align-items:center;justify-content:center;border:2px solid var(--gold);overflow:hidden}
.logo b{color:var(--g);font-weight:800;font-size:17px;letter-spacing:.5px}
.logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.tt{flex:1;min-width:0}
.tt .ar{font-size:21px;font-weight:800}
.tt .en{font-size:13px;opacity:.92;letter-spacing:.3px}
.tt .sub{font-size:11.5px;opacity:.8;margin-top:3px}
.search{position:sticky;top:0;z-index:8;background:var(--cream);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
font-family:inherit;outline:none;background:#fff}
.search input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(20,121,79,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.chip{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--g2);box-shadow:0 6px 18px rgba(14,92,62,.10);transform:translateY(-2px)}
.chip .strip{height:7px}
.chip .body{padding:12px 14px}
.chip .no{float:left;font-size:11px;color:var(--mut);font-weight:700}
.pbadge{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:20px;padding:2px 9px}
.chip .ar{font-size:19px;font-weight:800;margin:8px 0 1px}
.chip .sci{font-style:italic;color:#3a443e;font-size:13.5px;direction:ltr;text-align:left}
.chip .en{color:var(--mut);font-size:12px;direction:ltr;text-align:left}
/* CARD */
.card{display:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;
box-shadow:0 10px 30px rgba(14,92,62,.07);margin-top:6px}
.card.show{display:block}
.cstrip{height:9px}
.chead{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:16px 20px;position:relative}
.chead .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.chead .no{font-weight:800}
.chead .ar{font-size:28px;font-weight:800;margin:8px 0 2px;line-height:1.25}
.chead .sci{font-style:italic;font-size:17px;direction:ltr;text-align:right;opacity:.97}
.chead .sci .au{font-style:normal;opacity:.8}
.chead .en{direction:ltr;text-align:right;font-size:13.5px;opacity:.9;margin-top:2px}
.cbody{padding:8px 20px 20px}
.acc{background:#fbf4e0;border:1px solid #ecd9a6;color:#6f5410;border-radius:10px;padding:10px 12px;
font-size:13px;margin:14px 0 4px}
.sec{margin-top:18px}
.sec>h3{font-size:12.5px;color:var(--g);margin:0 0 9px;padding-bottom:6px;border-bottom:2px solid #eadfb9;
display:flex;justify-content:space-between;letter-spacing:.3px}
.sec>h3 .e{color:var(--gold2);font-weight:700}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.row{padding:8px 0;border-bottom:1px dashed var(--line)}
.row .lab{font-size:11px;color:var(--mut);font-weight:700}
.row .lab .e{color:#9aa6a0;font-weight:600}
.row .val{font-size:14.5px;margin-top:2px}
.row .val .e{display:block;direction:ltr;text-align:right;color:#46524c;font-size:13px;margin-top:1px}
.row.full{grid-column:1 / -1}
.latin{direction:ltr;text-align:right;font-style:italic}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:3px 11px}
.pill.ok{background:#e7f2ec;color:var(--g)}
.pill.warn{background:#fbeede;color:#9a5b00}
.heritage{background:#fbf6ea;border-right:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:14px}
.heritage .e{display:block;direction:ltr;text-align:right;color:#5b5333;font-size:12.5px;margin-top:5px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar .lab .e{color:var(--mut)}
.bar .track{height:9px;background:#e7f0ea;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--g2),var(--g))}
.transfer{display:flex;flex-wrap:wrap;gap:8px}
.transfer .t{background:#eef4f0;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px}
.transfer .t .e{display:block;direction:ltr;text-align:right;color:var(--mut);font-size:11.5px}
.srcs span{display:inline-block;background:#f0f4f1;border:1px solid var(--line);border-radius:7px;
padding:2px 8px;margin:2px 0 2px 5px;font-size:11.5px;color:#586059;direction:ltr}
.back{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--g);border:1px solid var(--line);
border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:700;margin:14px 0 4px}
.back:hover{background:#eef4f0}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:12.5px;
color:#5a635d;margin-top:16px}
.note .e{display:block;direction:ltr;text-align:right;color:#8a938d;margin-top:5px}
footer{text-align:center;color:var(--mut);font-size:11.5px;padding:20px 10px}
@media(max-width:600px){.rows,.bars{grid-template-columns:1fr}.chead .ar{font-size:24px}}

const PCOL={A:"#0E5C3E",B:"#9A6A0F",C:"#2E5A8F"};
const grid=document.getElementById('grid');
const listView=document.getElementById('listView'),cardView=document.getElementById('cardView');
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function pb(p){return '<span class="pbadge" style="background:'+PCOL[p]+'">'+ ({A:'قسم أ / Part A',B:'قسم ب / Part B',C:'قسم ج / Part C'}[p]) +'</span>';}

function renderList(f){
  f=(f||'').trim().toLowerCase();grid.innerHTML='';
  CARDS.filter(c=>!f||(c.ar+' '+c.en+' '+c.sci+' '+c.fam).toLowerCase().includes(f)).forEach(c=>{
    const d=document.createElement('div');d.className='chip';
    d.innerHTML='<div class="strip" style="background:'+PCOL[c.part]+'"></div><div class="body">'+
      '<div class="no">No. '+c.n+'/21</div>'+pb(c.part)+
      '<div class="ar ser">'+esc(c.ar)+'</div><div class="sci">'+esc(c.sci)+'</div><div class="en">'+esc(c.en)+'</div></div>';
    d.onclick=()=>location.hash='item-'+c.n;
    grid.appendChild(d);
  });
}
function biVal(p){ // p is [ar,en] or string
  if(Array.isArray(p))return esc(p[0])+'<span class="e">'+esc(p[1])+'</span>';
  return esc(p);
}
function row(labAr,labEn,valHtml,full,latin){
  if(valHtml==null||valHtml==='')return '';
  return '<div class="row'+(full?' full':'')+'"><div class="lab">'+labAr+' <span class="e">/ '+labEn+'</span></div>'+
    '<div class="val'+(latin?' latin':'')+'">'+valHtml+'</div></div>';
}
function bar(la,le,v){if(v==null)return '';const pct=Math.round(v/5*100);
  return '<div class="bar"><div class="lab"><span>'+la+' <span class="e">'+le+'</span></span><span>'+v+'/5</span></div>'+
    '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';}

function renderCard(n){
  const c=CARDS.find(x=>x.n===n);if(!c){location.hash='';return;}
  const col=PCOL[c.part];
  const citesWarn=/Appendix|الملحق/.test(c.cites[0]+c.cites[1]);
  const iucnWarn=/Endangered|Vulnerable|Near Threatened|مهدد|قريب من التهديد/.test(c.iucn[0]+c.iucn[1]);
  const pill=(p,warn)=>'<span class="pill '+(warn?'warn':'ok')+'">'+biVal(p)+'</span>';
  let s=c.scores,scoreHtml='';
  const hasS=s&&[s.water,s.salin,s.heat,s.soil,s.wind,s.maint,s.orn,s.func,s.h].some(v=>v!=null);
  if(hasS){scoreHtml='<div class="sec"><h3>ملاءمة DLSI للتنسيق القاحل <span class="e">DLSI suitability</span></h3><div class="bars">'+
    bar('العطش/الماء','Water',s.water)+bar('الملوحة','Salinity',s.salin)+bar('الحرارة','Heat',s.heat)+
    bar('التربة','Soil',s.soil)+bar('الرياح/الرمال','Wind/sand',s.wind)+bar('قلّة الصيانة','Low-maint',s.maint)+
    bar('القيمة الزينية','Ornamental',s.orn)+bar('الدور الوظيفي','Functional',s.func)+'</div>'+
    (s.h?'<div class="row full"><div class="lab">الارتفاع عند النضج <span class="e">/ Mature height</span></div><div class="val">'+esc(s.h)+' م / m</div></div>':'')+'</div>';}

  cardView.innerHTML=
  '<div class="back" onclick="location.hash=\'\'">→ كل الأصناف <span style="color:#9aa6a0">/ All items</span></div>'+
  '<div class="card show"><div class="cstrip" style="background:'+col+'"></div>'+
  '<div class="chead"><div class="meta"><div>'+pb(c.part)+' &nbsp;'+biVal(c.partname)+'</div><div class="no">No. '+c.n+'/21</div></div>'+
   '<div class="ar ser">'+esc(c.ar)+'</div>'+
   '<div class="sci">'+esc(c.sci)+' <span class="au">'+esc(c.auth)+'</span></div>'+
   '<div class="en">'+esc(c.en)+'</div></div>'+
  '<div class="cbody">'+
   (c.accepted?'<div class="acc"><b>الاسم المقبول / Accepted name:</b> '+esc(c.accepted[0])+' — '+esc(c.accepted[1])+'</div>':'')+
   '<div class="sec"><h3>التصنيف <span class="e">Taxonomy</span></h3><div class="rows">'+
     row('الاسم العلمي','Scientific name','<span>'+esc(c.sci)+'</span>',false,true)+
     row('المؤلِّف','Author','<span>'+esc(c.auth)+'</span>',false,true)+
     row('الفصيلة','Family','<span>'+esc(c.fam)+'</span>',false,true)+
     row('الرتبة','Order','<span>'+esc(c.order)+'</span>',false,true)+
   '</div></div>'+
   '<div class="sec"><h3>التوزيع والموئل <span class="e">Distribution &amp; habitat</span></h3><div class="rows">'+
     row('الشكل الحياتي','Growth form',biVal(c.habit))+
     row('الموئل/البيئة','Biome',biVal(c.biome))+
     row('الموطن (الأصالة)','Origin',biVal(c.origin))+
     row('النطاق الجغرافي','Native range',biVal(c.rng),true)+
   '</div></div>'+
   '<div class="sec"><h3>حالة الحفظ <span class="e">Conservation</span></h3><div class="rows">'+
     row('حالة IUCN','IUCN',pill(c.iucn,iucnWarn))+
     row('حالة CITES','CITES',pill(c.cites,citesWarn))+
   '</div></div>'+
   (c.heritage?'<div class="sec"><h3>التراث والإشارة <span class="e">Heritage</span></h3><div class="heritage">'+esc(c.heritage[0])+'<span class="e">'+esc(c.heritage[1])+'</span></div></div>':'')+
   (c.uses?'<div class="sec"><h3>الاستخدامات <span class="e">Uses</span></h3><div class="rows">'+row('الاستخدامات','Uses',biVal(c.uses),true)+'</div></div>':'')+
   scoreHtml+
   '<div class="sec"><h3>بيانات المادة <span class="e">Material details</span></h3><div class="transfer">'+
     '<div class="t"><b>المادة / Material:</b> '+esc(c.mat[0])+'<span class="e">'+esc(c.mat[1])+'</span></div>'+
     '<div class="t"><b>المنشأ / Origin:</b> '+esc(c.shipOrigin[0])+'<span class="e">'+esc(c.shipOrigin[1])+'</span></div>'+
     '<div class="t"><b>القسم / Part:</b> '+esc(c.partname[0])+'<span class="e">'+esc(c.partname[1])+'</span></div>'+
   '</div></div>'+
   '<div class="sec"><h3>المصادر <span class="e">Sources</span></h3><div class="srcs">'+(c.src||[]).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>'+
  '</div></div>';
}
function route(){const h=location.hash.replace('#','');
  if(h.indexOf('item-')===0){listView.style.display='none';cardView.style.display='block';
    renderCard(parseInt(h.slice(5),10));window.scrollTo(0,0);}
  else{cardView.style.display='none';listView.style.display='block';}}
window.addEventListener('hashchange',route);
renderList('');route();
</script>
